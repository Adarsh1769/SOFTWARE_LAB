<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo sign in</title>
  <style>
    body { font: 16px system-ui, sans-serif; margin: 3rem auto; max-width: 28rem; padding: 0 1rem; }
    label { display: block; margin-top: 1rem; }
    input, button { box-sizing: border-box; font: inherit; margin-top: .35rem; padding: .55rem; width: 100%; }
    button { cursor: pointer; margin-top: 1.25rem; }
    [role="status"] { min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>Sign in</h1>
    <p>This is a local UI-testing demo. It does not authenticate users.</p>
    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button id="sign-in" type="submit">Sign in</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const form = document.getElementById("login-form");
    const message = document.getElementById("message");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;

      if (email === "ada@example.com" && password === "LibraryDemo42") {
        message.textContent = "Welcome, Ada!";
        message.dataset.result = "success";
      } else {
        message.textContent = "Invalid email or password.";
        message.dataset.result = "error";
      }
    });
  </script>
</body>
</html>

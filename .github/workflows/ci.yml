name: Python project tests

on:
  push:
    paths:
      - ".github/workflows/ci.yml"
      - "practical-11-python/**"
      - "mini-project-study-planner/**"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "practical-11-python/**"
      - "mini-project-study-planner/**"

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run Practical 11 tests
        run: python -m unittest discover -s practical-11-python -p "test_*.py" -v
      - name: Run Study Planner tests
        run: python -m unittest discover -s mini-project-study-planner -p test_study_planner.py -v
